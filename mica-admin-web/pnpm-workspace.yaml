  qrcode: ^1.5.4
  qs: ^6.15.3
  reka-ui: ^2.10.1
  secure-ls: ^2.0.0
  sortablejs: ^1.15.7
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.1.4
  theme-colors: ^0.1.0
  tippy.js: ^6.3.7
  tw-animate-css: ^1.4.0
  vee-validate: ^4.15.1
  vue: ^3.5.39
  vue-i18n: ^11.4.6
  vue-json-pretty: ^2.6.0
  vue-router: 4.5.0
  vue-tippy: ^6.7.1
  vxe-pc-ui: ^4.16.7
  vxe-table: ^4.20.1
