  '@ctrl/tinycolor': ^4.2.0
  '@iconify/tailwind4': ^1.2.3
  '@iconify/vue': ^5.0.1
  '@intlify/core-base': ^9.14.5
  '@lucide/vue': ^1.24.0
  '@tanstack/vue-store': ^0.11.0
  '@tailwindcss/typography': ^0.5.15
  '@vee-validate/zod': ^4.15.1
  '@vue/shared': ^3.5.39
  '@vueuse/core': ^12.8.2
  '@vueuse/integrations': ^14.3.0
  '@vueuse/motion': ^2.2.6
  axios: ^1.18.1
  class-variance-authority: ^0.7.1
  clipboard: ^2.0.11
  clsx: ^2.1.1
  dayjs: ^1.11.21
  defu: ^6.1.7
  echarts: ^6.1.0
  es-toolkit: ^1.49.0
  jsencrypt: ^3.5.4
  json-bigint: ^1.0.0
  lodash-es: ^4.18.1
  lodash.clonedeep: ^4.5.0
  naive-ui: ^2.44.1
  nprogress: ^0.2.0
  pinia: ^3.0.4
