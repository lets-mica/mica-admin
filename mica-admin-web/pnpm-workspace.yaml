    '@vitejs/plugin-vue-jsx': ^4.1.2
    sass: ^1.101.0
    tailwindcss: ^4.3.2
    tw-animate-css: ^1.4.0
    typescript: ~5.7.3
    unplugin-auto-import: ^19.1.2
    unplugin-vue-components: ^28.5.0
    vite: ^6.4.3
    vite-plugin-vue-devtools: ^7.7.10
    vue-tsc: ^2.2.8

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  vue-demi: false
